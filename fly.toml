# Roomtake API on Fly.io:  fly deploy
# Secrets: fly secrets set MODEL_API_KEY=...
app = "roomtake-api"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Fly's proxy never stops the machine: analyses and looks run in the
  # background after their request returns. The app stops itself instead
  # after IDLE_STOP_MIN quiet minutes (backend/app/idle.py), and the proxy
  # starts it again on the next request.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[env]
  IDLE_STOP_MIN = "10"

# a clean exit (idle stop) leaves the machine stopped; a crash restarts it
[[restart]]
  policy = "on-failure"

# rooms, frames and renders
[[mounts]]
  source = "roomtake_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
